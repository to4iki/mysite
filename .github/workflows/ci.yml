name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ci-ignore
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".gitignore"
      - ".claude/**"
      - ".worktreeinclude"
      - "docs/**"
      - "scripts/r2/**"
      - "lefthook.yml"
  pull_request:
    branches: [main]
    paths-ignore: *ci-ignore

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint

  lhci:
    name: Lighthouse CI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: bun run build
      - name: Run Lighthouse CI
        run: bun run lhci

  a11y:
    name: Accessibility Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps
      - name: Check a11y
        run: |
          bun run build
          bun run a11y-check
