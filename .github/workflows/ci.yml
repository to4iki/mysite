name: CI

on:
  push:
    branches: [main]
    paths-ignore: &ci-ignore
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
      - ".worktreeinclude"
      - "docs/**"
      - "scripts/r2/**"
  pull_request:
    branches: [main]
    paths-ignore: *ci-ignore

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint

  knip:
    name: Knip
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Knip
        run: pnpm run knip

  lhci:
    name: Lighthouse CI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm run build
      - name: Run Lighthouse CI
        run: pnpm run lhci

  a11y:
    name: Accessibility Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Check a11y
        run: |
          pnpm run build
          pnpm run a11y-check
