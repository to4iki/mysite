name: Setup
description: Install Node, Bun, and frozen lockfile dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "lts/*"
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
